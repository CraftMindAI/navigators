<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <defs>
    <linearGradient id="nGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#001f3f"/>
      <stop offset="100%" style="stop-color:#004e92"/>
    </linearGradient>
  </defs>

  <!-- Left Abstract 'N' / Mountain Icon -->
  <g transform="translate(10, 20)">
    <!-- Left stroke of the N -->
    <path d="M 30 70 L 60 10 L 70 10 L 30 90 Z" fill="#ffffff"/>
    <path d="M 30 90 L 70 70 L 65 60 L 35 75 Z" fill="#ffffff"/>
    
    <!-- Right heavy part of the N (Gradient) -->
    <path d="M 60 10 L 100 80 L 100 30 L 70 10 Z" fill="url(#nGradient)"/>
    <path d="M 100 80 L 70 95 L 70 70 Z" fill="url(#nGradient)"/>
  </g>

  <!-- Small Mountain Icon Above Text -->
  <g transform="translate(120, 10) scale(0.6)">
    <!-- Small mountain peaks -->
    <path d="M 20 30 L 40 10 L 55 25 L 70 15 L 90 30 Z" fill="#ffffff"/>
    <path d="M 35 25 L 40 20 L 45 25 Z" fill="#cbd5e1"/>
    <path d="M 65 25 L 70 20 L 75 25 Z" fill="#cbd5e1"/>
  </g>

  <!-- Text Group -->
  <!-- "The" placed above the 'n' -->
  <text x="145" y="55" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#ffffff">The</text>
  
  <!-- "navigators" -->
  <text x="135" y="90" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#ffffff" letter-spacing="-1">navigators</text>
  
  <!-- "Travel the world" tagline under navigators (aligned right) -->
  <text x="245" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">Travel the world</text>
</svg>